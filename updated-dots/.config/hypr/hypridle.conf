general {
    lock_cmd = /home/ryona/.config/hyper-aero/scripts/airlock.sh
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 120
    on-timeout = /home/ryona/.config/hyper-aero/scripts/saver.sh start
    on-resume = /home/ryona/.config/hyper-aero/scripts/saver.sh stop
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
