"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

format = """
[╭─](#7c4c52)\
[](#dd1f41)[ ◢ DECK ](bold fg:#ffffff bg:#dd1f41)[](#dd1f41) \
$username[@](#ae8f93)$hostname\
[ ▸ ](#7c4c52)$directory\
$git_branch$git_status\
$python$nodejs$rust$c$java\
$fill\
$cmd_duration$status\
[ · ](#7c4c52)$time
$character"""

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold #f7eaec'
style_root = 'bold #ff5d6c'

[hostname]
ssh_only = false
format = '[$hostname]($style)'
style = 'bold #f7eaec'

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = 'bold #ffb1d0'
truncation_length = 4
truncation_symbol = '…/'
home_symbol = '~'
read_only = ' RO'
read_only_style = 'bold #ff5d6c'

[git_branch]
format = '[   $branch]($style)'
style = '#ee698e'

[git_status]
format = '([ \[$all_status$ahead_behind\]]($style))'
style = 'bold #f0b44c'

[python]
format = '[  py $version( $virtualenv)]($style)'
style = '#3ddc97'

[nodejs]
format = '[  node $version]($style)'
style = '#3ddc97'

[rust]
format = '[  rs $version]($style)'
style = '#3ddc97'

[c]
format = '[  c $version]($style)'
style = '#3ddc97'

[java]
format = '[  java $version]($style)'
style = '#3ddc97'

[fill]
symbol = '─'
style = '#451f22'

[cmd_duration]
min_time = 2000
format = '[ T+$duration ]($style)'
style = '#ae8f93'

[status]
disabled = false
format = '[ ERR $status ]($style)'
style = 'bold #ff5d6c'

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time]($style)'
style = '#ae8f93'

[character]
success_symbol = '[╰─▸](bold #ffb1d0)'
error_symbol = '[╰─▸](bold #ff5d6c)'
vimcmd_symbol = '[╰─◂](bold #3ddc97)'
